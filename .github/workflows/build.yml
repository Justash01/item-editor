name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packs/data/gametests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packs/data/gametests/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  build:
    name: Build pack
    runs-on: ubuntu-latest
    needs: check
    env:
      WEBSITE_DEPLOY_HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: Bedrock-OSS/regolith-action@v1.7.0
        with:
          profile: build
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package the mcpack
        run: |
          cd build/ItemEditor_bp
          zip -rq "$GITHUB_WORKSPACE/ItemEditor.mcpack" *
          cd "$GITHUB_WORKSPACE"
          unzip -l ItemEditor.mcpack
          unzip -l ItemEditor.mcpack | grep -qE ' manifest\.json$'

      - uses: actions/upload-artifact@v4
        with:
          name: ItemEditor
          path: ItemEditor.mcpack

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ItemEditor.mcpack
          fail_on_unmatched_files: true

      # jstash.dev builds its changelog from the releases, so rebuild it now
      # that this one has its mcpack. A release made with GITHUB_TOKEN doesn't
      # set off other workflows, which is why this lives here.
      - name: Rebuild the website
        if: startsWith(github.ref, 'refs/tags/') && env.WEBSITE_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$WEBSITE_DEPLOY_HOOK"
