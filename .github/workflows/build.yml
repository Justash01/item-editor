name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packs/data/gametests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packs/data/gametests/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  build:
    name: Build pack
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: Bedrock-OSS/regolith-action@v1.7.0
        with:
          profile: build
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package the mcpack
        run: |
          cd build/ItemEditor_bp
          zip -rq "$GITHUB_WORKSPACE/ItemEditor.mcpack" *
          cd "$GITHUB_WORKSPACE"
          unzip -l ItemEditor.mcpack
          unzip -l ItemEditor.mcpack | grep -qE ' manifest\.json$'

      - uses: actions/upload-artifact@v4
        with:
          name: ItemEditor
          path: ItemEditor.mcpack

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ItemEditor.mcpack
          fail_on_unmatched_files: true
